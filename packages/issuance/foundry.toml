[profile.default]
src = 'contracts'
out = 'forge-artifacts'
libs = ["node_modules"]
auto_detect_remappings = false
test = 'test'
remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/",
    "@graphprotocol/=node_modules/@graphprotocol/",
    "forge-std/=node_modules/forge-std/src/",
]
cache_path = 'cache_forge'
fs_permissions = [{ access = "read", path = "./" }, { access = "read", path = "node_modules/@graphprotocol/graph-core/artifacts" }]
solc_version = '0.8.35'
evm_version = 'cancun'
isolate = false
# Ported 0.7.6 contracts compile like their Hardhat override: 0.8.35, optimizer 200 runs, no viaIR
additional_compiler_profiles = [
    { name = "ported", via_ir = false, optimizer = true, optimizer_runs = 200, evm_version = "cancun" },
]
compilation_restrictions = [
    { paths = "contracts/rewards/**", version = "=0.8.35", via_ir = false, min_optimizer_runs = 200, max_optimizer_runs = 200, evm_version = "cancun" },
    { paths = "contracts/staking/**", version = "=0.8.35", via_ir = false, min_optimizer_runs = 200, max_optimizer_runs = 200, evm_version = "cancun" },
]
# Suppress solc warnings emitted from third-party code we don't control
# (e.g. @openzeppelin/foundry-upgrades' state-mutability suggestions).
ignored_warnings_from = ["node_modules"]

# Exclude test files from coverage reports
no_match_coverage = "(^test/|^contracts/test/|/mocks/)"

# Coverage profile: without the ported files' pins, which keep the optimizer on and let it inline
# small internal functions so coverage can't see them.
[profile.coverage]
additional_compiler_profiles = []
compilation_restrictions = []

# Opt-in profile for production-matching bytecode (viaIR + optimizer).
# Use FOUNDRY_PROFILE=prod for CI / pre-merge runs that should mirror what hardhat
# compiles for deploy. Default profile stays optimizer-off / viaIR-off for fast iteration.
[profile.prod]
optimizer = true
optimizer_runs = 100
via_ir = true

[lint]
# Disable lint-on-build: `pnpm lint:forge` (scoped to contracts/) is the canonical lint path
# for production code; auto-lint during build adds noise from test files without value.
lint_on_build = false
exclude_lints = ["mixed-case-function", "mixed-case-variable", "block-timestamp"]
ignore = ["node_modules/**", "test/node_modules/**"]
