[profile.default]
src = 'contracts'
out = 'forge-artifacts'
test = 'test'
libs = ["node_modules"]
cache_path = 'cache_forge'
auto_detect_remappings = false
remappings = [
    "@graphprotocol/=node_modules/@graphprotocol/",
    "@openzeppelin/=node_modules/@openzeppelin/",
    "forge-std/=node_modules/forge-std/src/",
]
evm_version = 'cancun'
optimizer = true
optimizer_runs = 200
compilation_restrictions = [
    { paths = "contracts/**", version = "=0.7.6" },
    { paths = "test/**", version = "=0.8.35" },
]
fs_permissions = [{ access = "read", path = "artifacts" }, { access = "read", path = "node_modules/@graphprotocol/graph-core/artifacts" }, { access = "read", path = "node_modules/@graphprotocol/graph-token/artifacts" }]
ignored_warnings_from = ["node_modules"]

[lint]
# Disable lint-on-build: forge's lint walker follows symlinks without cycle detection and
# infinite-loops on this package's pnpm-hoisted node_modules.
lint_on_build = false
exclude_lints = ["mixed-case-function", "mixed-case-variable", "block-timestamp"]
ignore = ["node_modules/**", "**/node_modules/**"]
